name: Sentinel security regression
on:
  push:
    branches: [main, feature/baifi-sentinel-trace-agents]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and agents
        run: python -m compileall -q app.py sentinel_trace tests
      - name: All discovered unit and stress tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Application import smoke test
        env:
          GROQ_API_KEY: ci-placeholder-not-a-secret
        run: python -c "import app; assert app.app is not None"
